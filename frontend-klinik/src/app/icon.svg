<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background gradient definitions -->
  <defs>
    <linearGradient id="medicalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" /> <!-- rose-600 (professional vibrant modern medical red) -->
      <stop offset="100%" stop-color="#9F1239" /> <!-- rose-800 -->
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#BE123C" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Sleek outer glowing circle -->
  <circle cx="256" cy="256" r="230" fill="url(#medicalGrad)" filter="url(#dropShadow)" />
  
  <!-- Clean white circular border for elegance -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.15" />
  
  <!-- Center group with elegant medical cross and active heartbeat line -->
  <g transform="translate(256, 256)">
    <!-- Vertical Cross Element -->
    <rect x="-35" y="-120" width="70" height="240" rx="20" fill="#FFFFFF" />
    <!-- Horizontal Cross Element -->
    <rect x="-120" y="-35" width="240" height="70" rx="20" fill="#FFFFFF" />
    
    <!-- Heartbeat/ECG line beautifully running inside the white cross in modern medical red -->
    <path d="M -90,0 L -45,0 L -25,-35 L -8,45 L 8,-50 L 25,25 L 45,0 L 90,0" 
          fill="none" 
          stroke="#E11D48" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
